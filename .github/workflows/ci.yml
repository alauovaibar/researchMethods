name: CI & Benchmark Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install -r requirements.txt

      - name: Run unit and integration tests
        run: |
          pytest -v tests/

      - name: Execute benchmark quickstart
        run: |
          python src/benchmark.py --config configs/config.yaml --output results/benchmark_sample_results.json

      - name: Execute parameter sweep
        run: |
          python src/benchmark.py --config configs/config.yaml --sweep --output results/benchmark_sweep_results.json

      - name: Build Docker Container
        run: |
          docker build -t rag-benchmark:latest .
